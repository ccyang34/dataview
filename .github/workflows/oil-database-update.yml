name: Update Oil Research Database

on:
  schedule:
    # 交易日北京时间 17:00 (UTC 09:00)，在豆油/棕榈油(16:30)、形态研究(16:45)更新之后重建数据库
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sql.js
        run: npm install sql.js --no-save

      - name: Rebuild SQLite database from three JSONs
        run: node scripts/build-oil-database.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/oil-research.sqlite src/data/oil-database-meta.json
          if git diff --cached --quiet; then
            echo "No database changes, skip commit."
          else
            git commit -m "chore: rebuild oil research SQLite database $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
